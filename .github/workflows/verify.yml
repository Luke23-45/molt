# Gate wiring: docs/implement_plan/06-ci-release-and-governance.md §1.
# Gates G1–G10 are defined in docs/implement_plan/02-tooling-and-quality-gates.md §3.
#
# The adapter, browser, and release-branch benchmark stages are real gates;
# their ledger items remain formally open until this workflow runs remotely.
name: verify

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 3 * * *' # nightly stress
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    # G1 typecheck, G2 lint + format, G5 dead-code hygiene — one command.
    name: static (G1 G2 G5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

  test:
    # G3 unit + coverage thresholds + happy-dom axis; G4 property half
    # (fixed seed for stability, one random-seed job per plan 04 §3).
    name: ${{ matrix.suite }} / ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22', '24']
        suite: [unit, property]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: unit suite with coverage thresholds (G3)
        if: matrix.suite == 'unit'
        run: pnpm test:coverage
      - name: unit suite under happy-dom (G3, plan 04 §5)
        if: matrix.suite == 'unit'
        run: pnpm test:dom
      - name: property suite, fixed seed (G4)
        if: matrix.suite == 'property'
        run: pnpm test:property
        env:
          FC_SEED: '20260831'
      - name: property suite, random seed (G4)
        if: matrix.suite == 'property' && matrix.os == 'ubuntu-latest' && matrix.node == '24'
        run: pnpm test:property

  stress:
    # G4 stress half — nightly and manual, not per-PR (plan 06 §1).
    name: stress (G4, nightly)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:stress

  package:
    # G6 purity, G7 packaging lint, G8 tarball install + Bun smoke.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: architecture rules (G6)
        run: pnpm check:arch
      - name: build (dual ESM/CJS)
        run: pnpm build
      - name: packaging lint (G7)
        run: pnpm check:pkg
      - name: tarball clean install (G8)
        run: |
          mkdir -p /tmp/molt-pack
          pnpm --filter @molt/runtime pack --pack-destination /tmp/molt-pack
          smoke_dir="$(mktemp -d)"
          cd "$smoke_dir"
          npm init -y >/dev/null
          npm install /tmp/molt-pack/*.tgz
          node -e "const m = require('@molt/runtime'); if (!m) process.exit(1);"
      - name: bun smoke (G8, ADR-13)
        uses: oven-sh/setup-bun@v2
      - name: bun smoke run (G8, ADR-13)
        run: bun -e "import('@molt/runtime').then((m) => { if (!m) process.exit(1); })"

  adapters:
    # P2/P3 adapter and unrelated-host replacement/leak suites.
    name: adapters and example hosts (P2/P3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:adapters

  browser:
    # P3-7 real-browser replacement smoke.
    name: browser smoke (P3-7)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @molt/browser-smoke exec playwright install --with-deps chromium
      - run: pnpm test:browser

  api:
    # G9 API review diff.
    name: api review (G9)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm check:api

  demo:
    # G10 — benchmarks regenerate on release branches only (plan 06 §1).
    name: bench artifact (G10)
    if: startsWith(github.ref, 'refs/heads/release') || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm bench
      - uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: demo/comparison/
