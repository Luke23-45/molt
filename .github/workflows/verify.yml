# Gate wiring: docs/implement_plan/06-ci-release-and-governance.md §1.
# Gates G1–G10 are defined in docs/implement_plan/02-tooling-and-quality-gates.md §3.
#
# Bootstrap note: stages whose enabling ledger items are still open run with
# continue-on-error (marked inline). Each marker names the ledger item that
# removes it — those markers are debt, tracked in the ledger, not decoration.
name: verify

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 3 * * *' # nightly stress
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    # G1 typecheck, G2 lint + format, G5 dead-code hygiene — one command.
    name: static (G1 G2 G5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

  test:
    # G3 unit + coverage thresholds; G4 property half.
    name: ${{ matrix.suite }} / ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22', '24']
        suite: [unit, property]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: unit suite (G3)
        if: matrix.suite == 'unit'
        run: pnpm test --coverage
      - name: property suite (G4)
        if: matrix.suite == 'property'
        # bootstrap: property tests arrive at P1-E7 — remove continue-on-error there
        continue-on-error: true
        run: pnpm test:property

  stress:
    # G4 stress half — nightly and manual, not per-PR (plan 06 §1).
    # bootstrap: stress tests arrive at P1-E8 — remove continue-on-error there
    name: stress (G4, nightly)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:stress

  package:
    # G6 purity, G7 packaging lint, G8 tarball install + Bun smoke.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: architecture rules (G6)
        run: pnpm check:arch
      - name: build (dual ESM/CJS)
        # bootstrap: tsdown and src arrive at P1-E10 — remove continue-on-error there
        continue-on-error: true
        run: pnpm build
      - name: packaging lint (G7)
        # bootstrap: dist arrives at P1-E10 — remove continue-on-error there
        continue-on-error: true
        run: pnpm check:pkg
      - name: tarball clean install (G8)
        # bootstrap: dist arrives at P1-E10 — remove continue-on-error there
        continue-on-error: true
        run: |
          mkdir -p /tmp/molt-pack
          pnpm --filter @molt/runtime pack --pack-destination /tmp/molt-pack
          smoke_dir="$(mktemp -d)"
          cd "$smoke_dir"
          npm init -y >/dev/null
          npm install /tmp/molt-pack/*.tgz
          node -e "const m = require('@molt/runtime'); if (!m) process.exit(1);"
      - name: bun smoke (G8, ADR-13)
        # bootstrap: dist arrives at P1-E10 — remove continue-on-error there
        continue-on-error: true
        uses: oven-sh/setup-bun@v2
      - name: bun smoke run (G8, ADR-13)
        # bootstrap: dist arrives at P1-E10 — remove continue-on-error there
        continue-on-error: true
        run: bun -e "import('@molt/runtime').then((m) => { if (!m) process.exit(1); })"

  api:
    # G9 API review diff.
    # bootstrap: api-extract scripts arrive at P1-E11 — remove continue-on-error there
    name: api review (G9)
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:api

  demo:
    # G10 — benchmarks regenerate on release branches only (plan 06 §1).
    # bootstrap: the comparison demo arrives at P3-6 — remove continue-on-error there
    name: bench artifact (G10)
    if: startsWith(github.ref, 'refs/heads/release') || startsWith(github.ref, 'refs/tags/')
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm bench
      - uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: demo/comparison/
